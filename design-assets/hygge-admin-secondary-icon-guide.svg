  <text x="863" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#30251F">EN</text>
  <text x="865" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#30251F">TRANSLATIONS</text>

