    <path d="M516 195h40" fill="none" stroke-linecap="round"/>
    <rect x="490" y="226" width="43" height="45" rx="8" fill="#F1CF72"/>
    <rect x="540" y="226" width="43" height="45" rx="8" fill="#54705D"/>
